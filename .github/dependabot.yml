version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # @n8n/node-cli pins eslint as an exact peer; move eslint only together with node-cli.
      - dependency-name: 'eslint'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
